<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acortador de enlaces</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Acortador de enlaces</h1>
    <form id="form">
      <input type="text" id="url" placeholder="https://www.ejemplo.com/pagina-larga" required>
      <button type="submit">Acortar</button>
    </form>
    <p id="error" class="error"></p>
    <div id="result" class="result hidden">
      <input type="text" id="short" readonly>
      <button id="copy" type="button">Copiar</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
